---
- name: Configure local machine
  hosts: all
  pre_tasks:
    - name: Show selected Python interpreter
      ansible.builtin.debug:
        msg: "Selected Python interpreter: {{ ansible_python_interpreter }}"
  roles:
    - role: git
    - role: misc_packages
    - role: gh_extensions
    - role: omz_zshrc
    - role: misc_dotfiles
    - role: vim
    - role: claude
    - role: pi
