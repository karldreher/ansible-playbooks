---
- name: Configure local machine
  hosts: all
  environment:
    # asdf shims (node, npm, go, ...) must resolve for every role, including pi.
    PATH: "{{ ansible_facts['user_dir'] }}/.asdf/shims:{{ ansible_facts['env']['PATH'] }}"
  pre_tasks:
    - name: Show selected Python interpreter
      ansible.builtin.debug:
        msg: "Selected Python interpreter: {{ ansible_python_interpreter }}"
  roles:
    - role: git
    - role: misc_packages
    - role: asdf
    - role: gh_extensions
    - role: omz_zshrc
    - role: misc_dotfiles
    - role: vim
    - role: claude
    - role: pi
