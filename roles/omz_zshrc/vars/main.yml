---
omz_zshrc_aliases:
  - alias: clone
    command: clone
    description: Clone a GitHub repo via 'gh repo clone'; accepts owner/repo or a github.com URL

  - alias: cleanup-branch
    command: cleanup-branch
    description: Cleanup current git branch and return to master/main

  - alias: download
    command: curl -OJL
    description: Download with Curl, 'curl -OJL <file>'.

  - alias: docker_build_this
    command: docker_build_this
    description: Build a Docker image with CWD as context and tag.

  - alias: docker_run_this
    command: docker_run_this
    description: Run a Docker container with CWD as tag.

  - alias: gtfo
    command: cleanup-branch
    description: Cleanup current git branch and return to default branch.

  - alias: flatten-json
    command: jq -c
    description: Flatten JSON document to one line.

  - alias: k
    command: kubectl
    description: Alias 'k' to kubectl.

  - alias: kns
    command: kubens
    description: Set kubernetes namespace with 'kubens'.

  - alias: stash
    command: git stash
    description: git stash

  - alias: unstash
    command: git unstash
    description: git unstash


# To enable more omz plugins, add them here.
omz_zshrc_omz_plugin_list:
  - git
  - terraform
  - nvm

# Notice files for profile experiments and reminders
omz_zshrc_notices:
  - file: experiments.txt
    title: Experiments
    header: |
      # Notification area for profile experiments in progress.  This file serves
      # as a reminder to self to re-apply the playbook and reconcile any
      # experiments once they are complete.
      # Add experiments as list items below.  Remove when no longer relevant.

  - file: reminders.txt
    title: Reminders
    header: |
      # Notification area for general reminders.  This file serves as a
      # reminder to self to re-apply the playbook and reconcile any reminders
      # once they are complete.
      # Add reminders as list items below.  Remove when no longer relevant.
