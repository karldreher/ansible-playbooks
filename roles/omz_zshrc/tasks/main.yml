---
# tasks file for omz-zshrc

- name: Check that OMZ folder exists
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.oh-my-zsh"
  register: omz_zshrc_omz_folder

- name: Install omz-vimtips plugin
  ansible.builtin.git:
    repo: https://github.com/karldreher/omz-vimtips.git
    dest: "{{ ansible_facts['user_dir'] }}/.oh-my-zsh/custom/plugins/omz-vimtips"
    version: c7cde5c19b78cccb629265915809c831f70209de
  when: "omz_zshrc_omz_folder.stat.exists and omz_zshrc_omz_folder.stat.isdir"

- name: Create notice files if they do not exist
  ansible.builtin.copy:
    dest: "{{ ansible_facts['user_dir'] }}/{{ item.file }}"
    content: "{{ item.header }}"
    force: false
    mode: "0644"
  loop: "{{ omz_zshrc_notices }}"
  loop_control:
    label: "{{ item.file }}"

- name: Template zsh configuration files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ ansible_facts['user_dir'] }}/{{ item.dest }}"
    mode: "0644"
  loop:
    # src is relative to templates/ directory in this role
    # dest is relative to the user's home directory
    - src: "zshrc.zsh.j2"
      dest: ".zshrc"
    - src: "zsh-custom/zsh-aliases.zsh.j2"
      dest: ".oh-my-zsh/custom/zsh-aliases.zsh"
    - src: "zsh-custom/zsh-notices.zsh.j2"
      dest: ".oh-my-zsh/custom/zsh-notices.zsh"
  when: "omz_zshrc_omz_folder.stat.exists and omz_zshrc_omz_folder.stat.isdir"

- name: Custom scripts directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.oh-my-zsh/custom/scripts"
    state: directory
    mode: "0755"
  register: omz_zshrc_custom_scripts_dir
  when: "omz_zshrc_omz_folder.stat.exists and omz_zshrc_omz_folder.stat.isdir"

- name: Remove goenv zsh configuration
  # TODO: remove upon next update
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.oh-my-zsh/custom/zsh-goenv.zsh"
    state: absent

- name: Remove legacy version manager directories
  # TODO: remove upon next update
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/{{ item }}"
    state: absent
  loop:
    - .goenv
    - .nvm
    - .pyenv

- name: Remove pyenv initialization from login shell profiles
  # TODO: remove upon next update
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/{{ item.0 }}"
    regexp: "{{ item.1 }}"
    state: absent
  loop: "{{ ['.zprofile', '.profile'] | product(omz_zshrc_pyenv_profile_patterns) | list }}"
  loop_control:
    label: "{{ item.0 }}: {{ item.1 }}"

- name: Template git_acp.zsh
  # TODO: remove upon next update
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.oh-my-zsh/custom/scripts/git_acp.zsh"
    state: absent
