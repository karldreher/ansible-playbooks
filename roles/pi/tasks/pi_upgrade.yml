---
- name: Upgrade pi via Homebrew  # noqa: package-latest
  community.general.homebrew:
    name: pi-coding-agent
    state: latest
  when: ansible_facts["os_family"] == "Darwin"

- name: Upgrade pi via install script  # noqa: command-instead-of-module
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://pi.dev/install.sh | sh
  args:
    executable: /bin/bash
  changed_when: true
  when: ansible_facts["os_family"] == "Debian"
