---
# vars file for git

git_alias_acp: &git_alias_acp >-
  !b=$(git branch --show-current); case "$b" in
  main|master) echo "On main/master. Aborting."; exit 1;;
  esac; git add . && git commit && git push

git_gitconfig:
  - name: alias.acp
    value: *git_alias_acp
  - name: alias.ac
    value: "!git add .; git commit"
  - name: alias.gafp
    value: "!git add . && git commit --amend && git push --force"
  - name: alias.ca
    value: "!git checkout -b $(date +%Y%m%d-%H%M%S)"
  - name: alias.cab
    value: "!git checkout -b $(date +%Y%m%d-%H%M%S)"
  - name: alias.cb
    value: checkout -b
  - name: alias.unstash
    value: "!git stash apply; git stash drop"
  - name: credential.helper
    value: cache --timeout 28800
  - name: push.autoSetupRemote
    value: true
  - name: fetch.prune
    value: true
