---
# Configure the GitHub CLI apt repository on Debian-based systems.
# Reference: https://github.com/cli/cli/blob/trunk/docs/install_linux.md#debian

- name: Install python3-debian (required by deb822_repository)
  ansible.builtin.apt:
    name: python3-debian
    state: present
  become: true

- name: Get dpkg architecture
  ansible.builtin.command: dpkg --print-architecture
  register: misc_packages_dpkg_arch
  changed_when: false

- name: Add GitHub CLI apt repository
  ansible.builtin.deb822_repository:
    name: github-cli
    types: deb
    uris: https://cli.github.com/packages
    suites: stable
    components: main
    architectures: "{{ misc_packages_dpkg_arch.stdout }}"
    signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    state: present
  become: true
