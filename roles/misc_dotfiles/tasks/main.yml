---
# tasks file for misc-dotfiles
- name: Create ghostty config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/ghostty"
    state: directory
    mode: "0755"

- name: Template ghostty config to $HOME/.config/ghostty/config
  ansible.builtin.template:
    src: templates/ghostty/config.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/ghostty/config"
    mode: "0644"

- name: Configure alacritty
  ansible.builtin.include_tasks: alacritty.yml
  when: ansible_facts["os_family"] == "Debian"

- name: Configure conductor
  ansible.builtin.include_tasks: conductor.yml
  # Conductor is macOS-only for now; drop this restriction once a Linux version is released.
  when: ansible_facts["os_family"] == "Darwin"
